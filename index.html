<!-- connect-src covers any http(s) host because the speech server endpoint is
     operator-configurable and may be on the LAN or hosted elsewhere; see
     SECURITY.md. Everything else stays same-origin. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' blob: 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' http: https:; font-src 'self' data:;">
<div id="root"></div><script type="module" src="/src/renderer/main.tsx"></script>
