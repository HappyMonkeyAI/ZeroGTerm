name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    # dev is the integration branch, so most pull requests target it. Verifying
    # only on main meant typecheck, tests, audit and build first ran when dev
    # was already merged — the point where a failure is most expensive to fix.
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
